services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: isers
      POSTGRES_USER: isers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before production launch}
    volumes:
      - isers_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isers -d isers"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://isers:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before production launch}@db:5432/isers
      SESSION_HOURS: ${SESSION_HOURS:-12}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  isers_pgdata:
